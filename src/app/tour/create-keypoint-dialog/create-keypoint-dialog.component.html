<h2 mat-dialog-title>Create Key Point</h2>

<mat-dialog-content [formGroup]="keyPointForm">
  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput formControlName="name" required />
    <mat-error *ngIf="keyPointForm.get('name')?.hasError('required')">
      Name is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput formControlName="description" required></textarea>
    <mat-error *ngIf="keyPointForm.get('description')?.hasError('required')">
      Description is required
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Order</mat-label>
    <input type="number" matInput formControlName="order" min="1" required />
    <mat-error *ngIf="keyPointForm.get('order')?.hasError('required')">
      Order is required
    </mat-error>
    <mat-error *ngIf="keyPointForm.get('order')?.hasError('min')">
      Order must be at least 1
    </mat-error>
  </mat-form-field>

  <div class="full-width">
    <label for="fileInput">Image</label>
    <input id="fileInput" type="file" (change)="onFileSelected($event)" required />
    <div *ngIf="!selectedFile && keyPointForm.touched" style="color:red;">
      Image is required
    </div>
  </div>

  <!-- Coordinates display -->
  <div class="coords-display">
    <p>Latitude: {{ data.latitude | number:'1.4-4' }}</p>
    <p>Longitude: {{ data.longitude | number:'1.4-4' }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="save()" [disabled]="!keyPointForm.valid">Save</button>
</mat-dialog-actions>
