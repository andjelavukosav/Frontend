<div class="tours-section">
  <div class="section-header">
    <h2 class="section-title">My Tours</h2>
  </div>

  <div class="tours-grid">
    <div *ngFor="let tour of tours" class="tour-card">

      <div class="card-header">
        <div class="status-badge" [ngClass]="tour.status">
          {{ tour.status }}
        </div>
        <div class="price-info">
          <span class="price">{{ tour.price }} RSD</span>
          <span *ngIf="tour.price === 0" class="price-note">(starting price)</span>
        </div>
      </div>

      <div class="title-section">
        <span class="field-label">Tour Name</span>
        <h3 class="tour-name">{{ tour.name }}</h3>
      </div>

      <div class="content-row">
        <div class="description-section">
          <span class="field-label">Description</span>
          <p class="tour-description">{{ tour.description }}</p>
        </div>
      </div>

      <div class="tags-section">
        <span class="field-label">Tags</span>
        <div class="tour-tags">
          <span *ngFor="let tag of tour.tags" class="tag">{{ tag }}</span>
        </div>
      </div>

      <!-- Glavna mapa ture -->
      <div class="key-points-section">
        <h3>Key Points on Map</h3>
        <div *ngIf="showPointsMap[tour.id!]" id="map-tour-{{tour.id}}" class="tour-map-container"></div>
      </div>
    </div>
  </div>
</div>
