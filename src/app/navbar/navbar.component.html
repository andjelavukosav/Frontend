<nav class="navbar">
  <div class="nav-container">
    <!-- Logo/Brand -->
    <div class="nav-brand">
      <a routerLink="/" class="brand-link">
        <span class="brand-icon">🗺️</span>
        <span class="brand-text">TourGuide</span>
      </a>
    </div>

    <!-- Navigacija za prijavljenog korisnika -->
    <div class="nav-links" *ngIf="authService.user$ | async as user">
      <!-- Zajednički linkovi za turistu i guide -->
      <a *ngIf="user.role === 'tourist' || user.role === 'guide'" 
         routerLink="/blogs" 
         routerLinkActive="active-link">
        Blogs
      </a>

      <!-- Linkovi samo za turiste -->
      <ng-container *ngIf="user.role === 'tourist'">
        <a routerLink="/position-simulator" routerLinkActive="active-link">
          Position Simulator
        </a>
        <a routerLink="/publish-tour" routerLinkActive="active-link">
          Publish Tour
        </a>
        <a routerLink="/shopping-cart" routerLinkActive="active-link">
          Cart
        </a>
        <a routerLink="/purchased-tours" routerLinkActive="active-link">
          Purchased Tours
        </a>
      </ng-container>

      <!-- Linkovi samo za vodiče -->
      <ng-container *ngIf="user.role === 'guide'">
        <a routerLink="/create-tour" routerLinkActive="active-link">
          Create Tour
        </a>
        <a routerLink="/tours" routerLinkActive="active-link">
          Tours
        </a>
      </ng-container>
    </div>
    
    <!-- Auth Buttons -->
    <div class="nav-auth">
      <ng-container *ngIf="!(authService.user$ | async)?.username; else loggedIn">
        <a routerLink="/register" class="auth-link register-btn">Register</a>
        <a routerLink="/login" class="auth-link register-btn">Login</a>
      </ng-container>

      <ng-template #loggedIn>
        <button class="auth-link logout-btn" (click)="logout()">Logout</button>
      </ng-template>
    </div>
  </div>
</nav>
