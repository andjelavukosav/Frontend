<app-navbar></app-navbar>

<main class="admin-container">
  <!-- Veliki kontejner preko cijelog ekrana -->
  <section class="main-card">
    <!-- Header sekcija (welcome + button u istom redu) -->
    <div class="welcome-header">
      <div class="welcome-text">
        <h1>Welcome, {{ user?.username }}</h1>
        <p>You have administrative privileges to manage users</p>
      </div>
      <button class="load-users-btn" (click)="loadUsers()">View All Users</button>
    </div>

    <!-- Tabela unutar istog kontejnera -->
    <div class="table-container" *ngIf="showUsersTable">
      <table class="users-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let u of users">
            <td>{{ u.id }}</td>
            <td>{{ u.username }}</td>
            <td>{{ u.email }}</td>
            <td>
              <span class="role-badge" [class.admin]="u.role === 'admin'" [class.user]="u.role === 'user'">
                {{ u.role }}
              </span>
            </td>
            <td>
            <!-- Ako je trenutno ulogovani korisnik, prikaži "You" -->
            <span *ngIf="isCurrentUser(u)" class="current-user">You</span>

            <!-- Ako nije trenutno ulogovani korisnik, prikaži dugme Block/Unblock -->
            <button *ngIf="!isCurrentUser(u)" 
                    [ngClass]="u.isBlocked ? 'unblock-btn' : 'block-btn'"
                    (click)="confirmToggleBlock(u)">
              {{ u.isBlocked ? 'Unblock' : 'Block' }}
            </button>
          </td>

          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<app-confirm-dialog
  *ngIf="confirmingUser"
  [message]="confirmMessage"
  (confirmed)="onDialogConfirmed($event)">
</app-confirm-dialog>
